name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python annotations, pathlib and types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python checkers
        run: python -m pip install --disable-pip-version-check ruff==0.17.3 ty==0.0.92
      - name: Check annotations, path operations and common bugs
        run: ruff check --isolated --select ANN,PTH,F,E9,B --target-version py39 skills/yomiyasu-en/scripts
      - name: Check Python 3.9 types
        run: ty check --python-version 3.9 skills/yomiyasu-en/scripts

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run the tests
        run: python -m pytest -q -ra
